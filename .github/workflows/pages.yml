# Veröffentlicht nur den Ordner website/ mit GitHub Pages.
# Auslöser: jeder Push auf main und manueller Start (Actions → „GitHub Pages“ → Run workflow).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung gleichzeitig; eine laufende wird nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dateien holen
        uses: actions/checkout@v7

      - name: Pages einrichten
        uses: actions/configure-pages@v6

      - name: Ordner website/ hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
